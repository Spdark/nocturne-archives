<!DOCTYPE html>
<html lang="en">
<head>

  <title>Nocturne Archives — Unsolved Mysteries &amp; Dark History</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #060a12;
      color: #e6eef7;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }
    .card {
      max-width: 680px;
      border: 1px solid rgba(217, 162, 75, 0.25);
      background: rgba(11, 18, 30, 0.92);
      padding: 48px 40px;
      text-align: center;
    }
    .tag {
      font-family: monospace;

      color: #d9a24b;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    h1 {
      font-family: Georgia, serif;
      font-size: 40px;
      margin: 0 0 16px;
      letter-spacing: 0.04em;
    }
    .rule {
      width: 96px;
      height: 2px;
      background: #d9a24b;
      margin: 0 auto 24px;
    }
    p {
      color: #9cb2ca;
      line-height: 1.65;
      font-size: 17px;
      margin-bottom: 28px;
    }
    a.btn {
      display: inline-block;
      padding: 12px 26px;
      border: 1px solid #d9a24b;
      color: #d9a24b;
      text-decoration: none;
      font-family: monospace;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 14px;
      margin: 6px;
    }
    a.btn:hover {
      background: #d9a24b;
      color: #060a12;
    }
    footer {
      margin-top: 32px;
      font-size: 13px;
      color: #6b8199;
    }
    footer a { color: #9cb2ca; }
  </style>
</head>
<body>
  <main class="card">
    <div class="tag">Official Channel Portal</div>
    <h1>NOCTURNE ARCHIVES</h1>
    <div class="rule"></div>
    <p>
      Unsolved mysteries, dark history mini-documentaries, and interactive POV thriller
      stories produced for a global YouTube audience.
    </p>
    <div>
      <a class="btn" href="https://www.youtube.com/@nocturnearchivestv" target="_blank" rel="noopener">
        Watch on YouTube
      </a>
      <a class="btn" href="./privacy.html">Privacy Policy</a>
    </div>
    <footer>
      Contact: <a href="mailto:tradewithsp31@gmail.com">tradewithsp31@gmail.com</a>
